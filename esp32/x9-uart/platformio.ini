; X9 UART bridge / sniffer on ESP32-S3
;   build: platformio run -d esp32/x9-uart
;   flash: platformio run -d esp32/x9-uart -t upload --upload-port /dev/ttyUSB0
[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
board_build.flash_mode = qio
