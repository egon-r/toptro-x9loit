<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>X9 SDK — Hello World</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <p class="eyebrow">X9 WEB SDK / HELLO + HTTP</p>
    <h1>Hello World</h1>
    <p>A web app for the stock Sraf browser.</p>
    <section aria-label="Network result">
      <h2>HTTP greeting</h2>
      <p id="network" role="status" aria-live="polite">Waiting for the server…</p>
    </section>
    <div class="actions">
      <button id="refresh" type="button">Fetch greeting</button>
      <button id="counter" type="button">Count: 0</button>
    </div>
    <p class="hint">Pointer + OK, or arrows + Enter. Home stays with the firmware.</p>
    <p class="limit">Web proof of concept. Local verification is not device certification.</p>
  </main>
  <script src="x9.js"></script>
  <script src="app.js"></script>
</body>
</html>
